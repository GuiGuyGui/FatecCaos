<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="refresh" content="0; url=zombiessurvive.html">
	<title>Redirecionando para Zombies Survive...</title>
	
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="index.icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
	<script src="coi-serviceworker.js"></script>
	<style>
		:root {
			--bg-base: #0a0a0f;
			--bg-surface: #12121a;
			--bg-card: #181824;
			--bg-card-hover: #222233;
			--border-color: rgba(255, 255, 255, 0.15);
			--border-bright: rgba(255, 255, 255, 0.35);
			--accent-primary: #00f0ff;
			--accent-danger: #ff0055;
			--accent-purple: #9d4edd;
			--accent-emerald: #00ff88;
			--accent-gold: #ffd60a;
			--text-white: #ffffff;
			--font-title: 'Orbitron', sans-serif;
			--font-sub: 'Rajdhani', sans-serif;
			--font-body: 'Inter', sans-serif;
			--font-code: 'Fira Code', monospace;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: var(--font-body);
			color: #ffffff !important;
		}

		body {
			background-color: var(--bg-base);
			background-image: 
				radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
				radial-gradient(circle at 85% 85%, rgba(157, 78, 221, 0.08) 0%, transparent 40%),
				linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
				linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
			background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			overflow-x: hidden;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: var(--font-title);
			font-weight: 700;
			color: #ffffff !important;
			letter-spacing: 0.5px;
		}

		p, span, div, a, button, input, textarea, select, li, td, th, b, strong, label {
			color: #ffffff !important;
		}

		a {
			text-decoration: none;
			transition: all 0.25s ease;
		}

		#navbar {
			position: sticky;
			top: 0;
			z-index: 1000;
			background: rgba(10, 10, 15, 0.92);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border-bottom: 1px solid var(--border-color);
			padding: 12px 28px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
		}

		.nav-brand {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.nav-logo {
			height: 44px;
			width: auto;
			object-fit: contain;
			filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.4));
			transition: transform 0.3s ease;
		}

		.nav-logo:hover {
			transform: scale(1.05);
		}

		.nav-links {
			display: flex;
			align-items: center;
			gap: 8px;
			list-style: none;
		}

		.nav-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 16px;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 600;
			letter-spacing: 0.3px;
			color: #ffffff !important;
			background: transparent;
			border: 1px solid transparent;
			transition: all 0.2s ease;
		}

		.nav-link:hover {
			background: rgba(255, 255, 255, 0.08);
			border-color: rgba(255, 255, 255, 0.2);
			transform: translateY(-1px);
		}

		.nav-link.active {
			background: linear-gradient(135deg, rgba(0, 240, 255, 0.2) 0%, rgba(157, 78, 221, 0.2) 100%);
			border-color: var(--accent-primary);
			box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
		}

		.nav-user-panel {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.nav-auth-btn {
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid var(--border-color);
			padding: 7px 14px;
			border-radius: 8px;
			font-size: 13px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.nav-auth-btn:hover {
			background: rgba(255, 255, 255, 0.12);
			border-color: #ffffff;
		}

		.user-pill-btn {
			display: flex;
			align-items: center;
			gap: 8px;
			background: var(--bg-card);
			border: 1px solid var(--border-bright);
			padding: 6px 12px;
			border-radius: 20px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.user-pill-btn:hover {
			border-color: var(--accent-primary);
			box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
		}

		.user-level-badge {
			background: var(--accent-purple);
			padding: 2px 8px;
			border-radius: 12px;
			font-size: 11px;
			font-weight: 800;
		}

		.btn-primary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: linear-gradient(135deg, #00f0ff 0%, #0088ff 100%);
			color: #05050a !important;
			font-family: var(--font-title);
			font-weight: 800;
			font-size: 14px;
			padding: 12px 24px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
			transition: all 0.25s ease;
			text-transform: uppercase;
		}

		.btn-primary * {
			color: #05050a !important;
		}

		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 22px rgba(0, 240, 255, 0.65);
			filter: brightness(1.1);
		}

		.btn-secondary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid var(--border-bright);
			font-family: var(--font-title);
			font-weight: 700;
			font-size: 13px;
			padding: 10px 20px;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.2s ease;
		}

		.btn-secondary:hover {
			background: rgba(255, 255, 255, 0.16);
			border-color: #ffffff;
			transform: translateY(-2px);
		}

		.container {
			max-width: 1280px;
			margin: 0 auto;
			padding: 30px 20px;
			width: 100%;
			flex: 1;
		}

		.card {
			background: var(--bg-card);
			border: 1px solid var(--border-color);
			border-radius: 14px;
			padding: 24px;
			box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
			transition: all 0.25s ease;
		}

		.card:hover {
			border-color: var(--border-bright);
			transform: translateY(-2px);
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			padding: 4px 10px;
			border-radius: 6px;
			font-size: 12px;
			font-weight: 700;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.15);
		}

		.input-field {
			width: 100%;
			background: rgba(0, 0, 0, 0.4);
			border: 1px solid var(--border-color);
			border-radius: 8px;
			padding: 10px 14px;
			font-size: 14px;
			color: #ffffff !important;
			outline: none;
			margin-top: 6px;
			margin-bottom: 14px;
			transition: border-color 0.2s;
		}

		.input-field:focus {
			border-color: var(--accent-primary);
			box-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
		}

		.modal-backdrop {
			position: fixed;
			top: 0;
			left: 0;
			width: 100vw;
			height: 100vh;
			background: rgba(0, 0, 0, 0.85);
			backdrop-filter: blur(10px);
			z-index: 2000;
			display: none;
			align-items: center;
			justify-content: center;
			padding: 20px;
		}

		.modal-box {
			background: var(--bg-surface);
			border: 1px solid var(--border-bright);
			border-radius: 16px;
			padding: 30px;
			max-width: 500px;
			width: 100%;
			position: relative;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 240, 255, 0.2);
		}

		.modal-close-btn {
			position: absolute;
			top: 18px;
			right: 18px;
			background: rgba(255, 255, 255, 0.1);
			border: none;
			width: 32px;
			height: 32px;
			border-radius: 50%;
			cursor: pointer;
			font-size: 16px;
			display: flex;
			align-items: center;
			justify-content: center;
		}

		.avatar-picker-row {
			display: flex;
			gap: 8px;
			margin: 10px 0 16px 0;
			flex-wrap: wrap;
		}

		.avatar-choice {
			font-size: 26px;
			padding: 6px;
			border-radius: 10px;
			border: 2px solid transparent;
			cursor: pointer;
			transition: all 0.2s;
			background: rgba(255, 255, 255, 0.05);
		}

		.avatar-choice:hover, .avatar-choice.selected {
			border-color: var(--accent-primary);
			background: rgba(0, 240, 255, 0.2);
			transform: scale(1.1);
		}

		footer {
			background: #07070a;
			border-top: 1px solid var(--border-color);
			padding: 30px 20px;
			text-align: center;
			margin-top: auto;
		}

		.footer-links {
			display: flex;
			justify-content: center;
			gap: 20px;
			margin-bottom: 14px;
			flex-wrap: wrap;
		}

		.footer-links a {
			font-size: 13px;
			color: #ffffff !important;
			opacity: 0.8;
		}

		.footer-links a:hover {
			opacity: 1;
			color: var(--accent-primary) !important;
		}

		@media (max-width: 900px) {
			#navbar {
				flex-wrap: wrap;
				gap: 12px;
				padding: 12px 16px;
			}
			.nav-links {
				order: 3;
				width: 100%;
				overflow-x: auto;
				padding-bottom: 4px;
			}
		}
	</style>

</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center;">
	<div class="card" style="max-width: 500px; padding: 40px;">
		<h2 style="font-size: 26px; margin-bottom: 14px;">🧟‍♂️ Zombies Survive</h2>
		<p style="font-size: 15px; margin-bottom: 24px; opacity: 0.85;">
			O jogo foi atualizado para o nome oficial <b>Zombies Survive</b>. Você será redirecionado em instantes...
		</p>
		<a href="zombiessurvive.html" class="btn-primary">
			Clique aqui para Acessar Agora
		</a>
	</div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<title>Plantão TI | Assistência Técnica & Reparo de Computadores | OmniVoid Studios</title>
	
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="index.icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
	<script src="coi-serviceworker.js"></script>
	<style>
		:root {
			--bg-base: #07070c;
			--bg-surface: #101018;
			--bg-card: #151522;
			--bg-card-hover: #1e1e30;
			--border-color: rgba(255, 255, 255, 0.12);
			--border-bright: rgba(255, 255, 255, 0.3);
			--accent-primary: #00f0ff;
			--accent-danger: #ff0055;
			--accent-purple: #9d4edd;
			--accent-emerald: #00ff88;
			--accent-gold: #ffd60a;
			--text-white: #ffffff;
			--font-title: 'Orbitron', sans-serif;
			--font-sub: 'Rajdhani', sans-serif;
			--font-body: 'Inter', sans-serif;
			--font-code: 'Fira Code', monospace;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: var(--font-body);
			color: #ffffff !important;
		}

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: var(--bg-base);
		}

		body {
			display: flex;
			flex-direction: column;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: var(--font-title);
			font-weight: 700;
			color: #ffffff !important;
			letter-spacing: 0.5px;
		}

		p, span, div, a, button, input, textarea, select, li, td, th, b, strong, label {
			color: #ffffff !important;
		}

		a {
			text-decoration: none;
			transition: all 0.25s ease;
		}

		#navbar {
			position: relative;
			z-index: 1000;
			background: rgba(7, 7, 12, 0.96);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border-bottom: 1px solid var(--border-color);
			padding: 10px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
			flex-shrink: 0;
		}

		.nav-brand {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.nav-logo {
			height: 52px;
			width: auto;
			object-fit: contain;
			filter: none !important;
			transition: transform 0.2s ease;
		}

		.nav-logo:hover {
			transform: scale(1.05);
		}

		.nav-links {
			display: flex;
			align-items: center;
			gap: 6px;
			list-style: none;
		}

		.nav-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 14px;
			border-radius: 8px;
			font-size: 13.5px;
			font-weight: 600;
			letter-spacing: 0.3px;
			color: #ffffff !important;
			background: transparent;
			border: 1px solid transparent;
			transition: all 0.2s ease;
			white-space: nowrap;
		}

		.nav-link:hover {
			background: rgba(255, 255, 255, 0.08);
			border-color: rgba(255, 255, 255, 0.2);
			transform: translateY(-1px);
		}

		.nav-link.active {
			background: linear-gradient(135deg, rgba(255, 214, 10, 0.2) 0%, rgba(255, 136, 0, 0.2) 100%);
			border-color: var(--accent-gold);
			color: var(--accent-gold) !important;
			box-shadow: 0 0 12px rgba(255, 214, 10, 0.3);
		}

		.nav-user-panel {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.btn-primary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: linear-gradient(135deg, #ffd60a 0%, #ff8800 100%);
			color: #05050a !important;
			font-family: var(--font-title);
			font-weight: 800;
			font-size: 13px;
			padding: 8px 16px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			box-shadow: 0 4px 15px rgba(255, 214, 10, 0.4);
			transition: all 0.25s ease;
			text-transform: uppercase;
		}

		.btn-primary * { color: #05050a !important; }

		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(255, 214, 10, 0.6);
		}

		.btn-secondary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: rgba(255, 255, 255, 0.06);
			color: #ffffff !important;
			border: 1px solid var(--border-color);
			font-weight: 600;
			font-size: 13px;
			padding: 8px 14px;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.25s ease;
		}

		.btn-secondary:hover {
			background: rgba(255, 255, 255, 0.12);
			border-color: rgba(255, 255, 255, 0.3);
		}

		#game-viewport {
			flex: 1;
			width: 100%;
			height: calc(100vh - 128px);
			border: none;
			background: #111119;
			display: block;
		}

		
		/* Hub Switcher Plantão TI / Plantão Dev */
		.plantao-hub-header {
			background: rgba(16, 16, 24, 0.95);
			backdrop-filter: blur(12px);
			border-bottom: 1px solid rgba(255, 255, 255, 0.1);
			padding: 8px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			flex-wrap: wrap;
			gap: 12px;
			z-index: 999;
			flex-shrink: 0;
		}

		.hub-tabs {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
		}

		.hub-tab-btn {
			display: flex;
			align-items: center;
			gap: 10px;
			background: rgba(255, 255, 255, 0.04);
			border: 1.5px solid rgba(255, 255, 255, 0.12);
			border-radius: 10px;
			padding: 7px 16px;
			cursor: pointer;
			transition: all 0.25s ease;
			text-align: left;
			position: relative;
		}

		.hub-tab-btn:hover {
			background: rgba(255, 255, 255, 0.08);
			border-color: rgba(255, 255, 255, 0.25);
			transform: translateY(-1px);
		}

		.hub-tab-btn.active#tab-game-ti {
			background: linear-gradient(135deg, rgba(255, 214, 10, 0.15) 0%, rgba(255, 136, 0, 0.1) 100%);
			border-color: var(--accent-gold);
			box-shadow: 0 0 15px rgba(255, 214, 10, 0.25);
		}

		.hub-tab-btn.active#tab-game-dev {
			background: linear-gradient(135deg, rgba(0, 240, 255, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
			border-color: var(--accent-primary);
			box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
		}

		.hub-tab-icon {
			font-size: 20px;
			line-height: 1;
		}

		.hub-tab-info {
			display: flex;
			flex-direction: column;
		}

		.hub-tab-title {
			font-family: var(--font-title);
			font-size: 13.5px;
			font-weight: 800;
			letter-spacing: 0.5px;
		}

		.hub-tab-desc {
			font-size: 10.5px;
			color: #94a3b8 !important;
			font-weight: 500;
		}

		.hub-badge-new {
			font-size: 9px;
			font-weight: 900;
			background: #00f0ff;
			color: #07070c !important;
			padding: 2px 6px;
			border-radius: 99px;
			letter-spacing: 0.5px;
			position: absolute;
			top: -6px;
			right: -6px;
			box-shadow: 0 0 8px #00f0ff;
		}

		.hub-actions {
			display: flex;
			align-items: center;
			gap: 12px;
			flex-wrap: wrap;
		}

		.hub-game-label {
			font-size: 12px;
			font-weight: 700;
			color: #cbd5e1 !important;
			padding: 5px 12px;
			background: rgba(255, 255, 255, 0.05);
			border: 1px solid rgba(255, 255, 255, 0.1);
			border-radius: 8px;
		}

		.hub-profile-btn {
			font-size: 12px;
			font-weight: 700;
			background: rgba(168, 85, 247, 0.15);
			border: 1px solid rgba(168, 85, 247, 0.4);
			padding: 6px 14px;
			border-radius: 8px;
			color: #e9d5ff !important;
			transition: all 0.2s ease;
		}

		.hub-profile-btn:hover {
			background: rgba(168, 85, 247, 0.3);
			border-color: #a855f7;
			transform: translateY(-1px);
		}

		/* Modal Auth */
		.modal-backdrop {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.85);
			backdrop-filter: blur(8px);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
		}

		.modal-box {
			background: var(--bg-card);
			border: 1px solid var(--border-bright);
			border-radius: 16px;
			width: 90%;
			max-width: 440px;
			padding: 28px;
			position: relative;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
		}

		.modal-close-btn {
			position: absolute;
			top: 16px;
			right: 16px;
			background: transparent;
			border: none;
			font-size: 20px;
			cursor: pointer;
			opacity: 0.6;
		}

		.modal-close-btn:hover { opacity: 1; }

		@media (max-width: 1100px) {
			.nav-links {
				overflow-x: auto;
				padding-bottom: 4px;
				scrollbar-width: none;
			}
			.nav-links::-webkit-scrollbar { display: none; }
		}
	</style>
</head>
<body>
	<!-- NAVBAR GLOBAL OMNIVOID -->
	<nav id="navbar">
		<a href="index.html" class="nav-brand">
			<img src="logo_omnivoid.png" alt="OmniVoid Studios" class="nav-logo">
		</a>

		<ul class="nav-links">
			<li><a href="index.html" class="nav-link">Início</a></li>
			<li><a href="jornada.html" class="nav-link">⚡ Jornada Dev</a></li>
			<li><a href="pentest.html" class="nav-link">🛡️ Pentest &amp; Hacking</a></li>
			<li><a href="aula.html" class="nav-link">🎓 Aulas</a></li>
			<li><a href="perfil.html" class="nav-link">👤 Meu Perfil</a></li>
			<li><a href="orcamento.html" class="nav-link">Serviços &amp; Orçamento</a></li>
			<li><a href="plantaoti.html" class="nav-link active">🛠️ Plantão TI</a></li>
			<li><a href="jogos.html" class="nav-link">Jogos</a></li>
			<li><a href="quiz.html" class="nav-link">Teste Dev</a></li>
			<li><a href="projetos.html" class="nav-link">Projetos</a></li>
			<li><a href="devchat.html" class="nav-link">Conversa Dev</a></li>
			<li><a href="sobre.html" class="nav-link">Sobre Mim</a></li>
		</ul>

		<div class="nav-user-panel">
			<div id="auth-logged-out" style="display: flex; align-items: center; gap: 8px;">
				<button class="btn-secondary" onclick="openAuthModal('login')">
					<span>👤 Entrar</span>
				</button>
				<button class="btn-primary" onclick="openAuthModal('register')">
					Cadastrar
				</button>
			</div>

			<div id="auth-logged-in" style="display: none; align-items: center; gap: 8px;">
				<a href="perfil.html" class="btn-secondary" style="border-color: rgba(255, 214, 10, 0.4);">
					<span id="nav-user-avatar">👤</span>
					<span id="nav-user-name">Usuário</span>
				</a>
			</div>
		</div>
	</nav>

	<!-- SELETOR OFICIAL DE JOGOS: PLANTÃO TI & PLANTÃO DEV -->
	<div class="plantao-hub-header">
		<div class="hub-tabs">
			<button class="hub-tab-btn active" id="tab-game-ti" onclick="switchGameMode('ti')" title="Jogar Plantão TI: Assistência Técnica & Reparo de Computadores">
				<span class="hub-tab-icon">🛠️</span>
				<div class="hub-tab-info">
					<span class="hub-tab-title">Plantão TI</span>
					<span class="hub-tab-desc">Assistência Técnica & Hardware</span>
				</div>
			</button>
			<button class="hub-tab-btn" id="tab-game-dev" onclick="switchGameMode('dev')" title="Jogar Plantão Dev: Software House & Sprints Tech Co-op">
				<span class="hub-tab-icon">💻</span>
				<div class="hub-tab-info">
					<span class="hub-tab-title">Plantão Dev</span>
					<span class="hub-tab-desc">Software House & Sprints Tech</span>
				</div>
				<span class="hub-badge-new">NOVO</span>
			</button>
		</div>
		<div class="hub-actions">
			<span id="active-game-label" class="hub-game-label">🛠️ Oficina de Hardware Ativa</span>
			<a href="perfil.html" class="hub-profile-btn" title="Ver Carreira, Estatísticas e Títulos no Meu Perfil">
				👤 Meu Perfil Dev & TI
			</a>
		</div>
	</div>

	<!-- JOGO COMPLETO PLANTÃO TI (EXECUTADO DIRETAMENTE DA PASTA TI) -->
	<iframe id="game-viewport" src="TI/index.html" allow="autoplay; fullscreen; clipboard-read; clipboard-write;"></iframe>

	<!-- MODAL DE AUTENTICAÇÃO -->
	<div id="modal-auth" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'modal-auth')">
		<div class="modal-box">
			<button class="modal-close-btn" onclick="closeModal('modal-auth')">✕</button>
			
			<div id="auth-tab-row" style="display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 10px;">
				<button id="tab-btn-login" class="nav-link active" onclick="switchAuthTab('login')">Entrar na Conta</button>
				<button id="tab-btn-register" class="nav-link" onclick="switchAuthTab('register')">Novo Cadastro</button>
			</div>

			<!-- Form Login -->
			<form id="form-auth-login" onsubmit="handleAuthLogin(event)" style="display: flex; flex-direction: column; gap: 14px;">
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">E-mail ou Usuário:</label>
					<input type="text" id="login-user" required placeholder="seu_usuario ou email" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">Senha:</label>
					<input type="password" id="login-pass" required placeholder="••••••••" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 6px;">
					Acessar Conta ➔
				</button>
			</form>

			<!-- Form Register -->
			<form id="form-auth-register" onsubmit="handleAuthRegister(event)" style="display: none; flex-direction: column; gap: 14px;">
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">Seu Nome ou Apelido:</label>
					<input type="text" id="reg-name" required placeholder="Como quer ser chamado" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">E-mail:</label>
					<input type="email" id="reg-email" required placeholder="seu@email.com" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">Criar Senha:</label>
					<input type="password" id="reg-pass" required placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 6px;">
					Criar Minha Conta ➔
				</button>
			</form>
		</div>
	</div>

	<!-- Auth logic -->
	<script>
		function updateNavUser() {
			try {
				const user = JSON.parse(localStorage.getItem('omnivoid_user'));
				if (user && (user.name || user.nickname)) {
					document.getElementById('auth-logged-out').style.display = 'none';
					const loggedIn = document.getElementById('auth-logged-in');
					loggedIn.style.display = 'flex';
					document.getElementById('nav-user-name').innerText = user.nickname || user.name;
					document.getElementById('nav-user-avatar').innerText = user.avatar || '👤';
				} else {
					document.getElementById('auth-logged-out').style.display = 'flex';
					document.getElementById('auth-logged-in').style.display = 'none';
				}
			} catch(e) {}
		}

		function openAuthModal(tab) {
			const m = document.getElementById('modal-auth');
			if (m) m.style.display = 'flex';
			switchAuthTab(tab);
		}

		function closeModal(id) {
			const m = document.getElementById(id);
			if (m) m.style.display = 'none';
		}

		function closeModalOnBackdrop(e, id) {
			if (e.target.id === id) closeModal(id);
		}

		function switchAuthTab(tab) {
			const btnLogin = document.getElementById('tab-btn-login');
			const btnReg = document.getElementById('tab-btn-register');
			const formLogin = document.getElementById('form-auth-login');
			const formReg = document.getElementById('form-auth-register');

			if (tab === 'login') {
				btnLogin.classList.add('active');
				btnReg.classList.remove('active');
				formLogin.style.display = 'flex';
				formReg.style.display = 'none';
			} else {
				btnReg.classList.add('active');
				btnLogin.classList.remove('active');
				formReg.style.display = 'flex';
				formLogin.style.display = 'none';
			}
		}

		function getUsersDB() {
			try {
				return JSON.parse(localStorage.getItem("omnivoid_users_db") || "[]");
			} catch (e) {
				return [];
			}
		}

		function saveUsersDB(users) {
			localStorage.setItem("omnivoid_users_db", JSON.stringify(users));
		}

		function getCurrentUser() {
			try {
				const stored = localStorage.getItem("omnivoid_current_user");
				if (stored) {
					const parsed = JSON.parse(stored);
					if (parsed && (parsed.nickname || parsed.name)) return parsed;
				}
			} catch (e) {}
			return null;
		}

		function setCurrentUser(user) {
			if (user) {
				localStorage.setItem("omnivoid_current_user", JSON.stringify(user));
				localStorage.setItem("omnivoid_user", JSON.stringify(user));
				if (user.jornadaState) {
					localStorage.setItem("omni_jornada_v2", JSON.stringify(user.jornadaState));
				}
				if (user.hackState) {
					localStorage.setItem("omni_jornadahack_v1", JSON.stringify(user.hackState));
				}
				if (user.plantaoTI) {
					localStorage.setItem("omnivoid_plantaoti_profile", JSON.stringify(user.plantaoTI));
				}
				if (user.plantaoDev) {
					localStorage.setItem("omnivoid_plantaodev_profile", JSON.stringify(user.plantaoDev));
				}
			} else {
				localStorage.removeItem("omnivoid_current_user");
				localStorage.removeItem("omnivoid_user");
			}
			updateNavUser();
		}

		function handleAuthLogin(e) {
			e.preventDefault();
			const ident = document.getElementById('login-user').value.trim().toLowerCase();
			const pass = document.getElementById('login-pass').value.trim();
			const db = getUsersDB();
			const found = db.find(u => (u.email.toLowerCase() === ident || (u.nickname && u.nickname.toLowerCase() === ident)) && u.password === pass);

			if (found) {
				setCurrentUser(found);
				closeModal('modal-auth');
				alert("Bem-vindo de volta, " + (found.nickname || found.name) + "!");
				// Recarrega o iframe para carregar os dados atualizados do usuário
				const frame = document.getElementById('game-viewport');
				if (frame) frame.src = frame.src;
			} else {
				alert("Usuário ou senha incorretos. Caso ainda não tenha conta, clique na aba 'Novo Cadastro'.");
			}
		}

		function handleAuthRegister(e) {
			e.preventDefault();
			const name = document.getElementById('reg-name').value.trim();
			const email = document.getElementById('reg-email').value.trim().toLowerCase();
			const pass = document.getElementById('reg-pass').value.trim();
			const db = getUsersDB();

			if (db.some(u => u.email.toLowerCase() === email || (u.nickname && u.nickname.toLowerCase() === name.toLowerCase()))) {
				alert("E-mail ou Nome de usuário já cadastrados!");
				return;
			}

			const newUser = {
				name: name,
				nickname: name,
				email: email,
				password: pass,
				avatar: '🧑‍💻',
				level: 1,
				xp: 0,

		}

		
		function switchGameMode(mode) {
			const frame = document.getElementById('game-viewport');
			const btnTI = document.getElementById('tab-game-ti');
			const btnDev = document.getElementById('tab-game-dev');
			const label = document.getElementById('active-game-label');

			if (mode === 'dev') {
				if (btnDev) btnDev.classList.add('active');
				if (btnTI) btnTI.classList.remove('active');
				if (label) label.innerHTML = '💻 Software House Ativa';
				if (frame) frame.src = 'DEV/software.html';
				try {
					const url = new URL(window.location.href);
					url.searchParams.set('game', 'dev');
					window.history.replaceState({}, '', url.toString());
				} catch(e) {}
			} else {
				if (btnTI) btnTI.classList.add('active');
				if (btnDev) btnDev.classList.remove('active');
				if (label) label.innerHTML = '🛠️ Oficina de Hardware Ativa';
				if (frame) frame.src = 'TI/index.html';
				try {
					const url = new URL(window.location.href);
					url.searchParams.set('game', 'ti');
					window.history.replaceState({}, '', url.toString());
				} catch(e) {}
			}
		}

		document.addEventListener('DOMContentLoaded', () => {
			updateNavUser();
			const params = new URLSearchParams(window.location.search);
			if (params.get('game') === 'dev') {
				switchGameMode('dev');
			}
		});
	</script>

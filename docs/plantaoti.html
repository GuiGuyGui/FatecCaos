<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<title>Plantão TI | Assistência Técnica & Reparo de Computadores | OmniVoid Studios</title>
	
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" type="image/png" href="index.icon.png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
	<script src="coi-serviceworker.js"></script>
	<style>
		:root {
			--bg-base: #07070c;
			--bg-surface: #101018;
			--bg-card: #151522;
			--bg-card-hover: #1e1e30;
			--border-color: rgba(255, 255, 255, 0.12);
			--border-bright: rgba(255, 255, 255, 0.3);
			--accent-primary: #00f0ff;
			--accent-danger: #ff0055;
			--accent-purple: #9d4edd;
			--accent-emerald: #00ff88;
			--accent-gold: #ffd60a;
			--text-white: #ffffff;
			--font-title: 'Orbitron', sans-serif;
			--font-sub: 'Rajdhani', sans-serif;
			--font-body: 'Inter', sans-serif;
			--font-code: 'Fira Code', monospace;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: var(--font-body);
			color: #ffffff !important;
		}

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
			overflow: hidden;
			background-color: var(--bg-base);
		}

		body {
			display: flex;
			flex-direction: column;
		}

		h1, h2, h3, h4, h5, h6 {
			font-family: var(--font-title);
			font-weight: 700;
			color: #ffffff !important;
			letter-spacing: 0.5px;
		}

		p, span, div, a, button, input, textarea, select, li, td, th, b, strong, label {
			color: #ffffff !important;
		}

		a {
			text-decoration: none;
			transition: all 0.25s ease;
		}

		#navbar {
			position: relative;
			z-index: 1000;
			background: rgba(7, 7, 12, 0.96);
			backdrop-filter: blur(14px);
			-webkit-backdrop-filter: blur(14px);
			border-bottom: 1px solid var(--border-color);
			padding: 10px 24px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			box-shadow: 0 4px 25px rgba(0, 0, 0, 0.8);
			flex-shrink: 0;
		}

		.nav-brand {
			display: flex;
			align-items: center;
			gap: 12px;
		}

		.nav-logo {
			height: 52px;
			width: auto;
			object-fit: contain;
			filter: none !important;
			transition: transform 0.2s ease;
		}

		.nav-logo:hover {
			transform: scale(1.05);
		}

		.nav-links {
			display: flex;
			align-items: center;
			gap: 6px;
			list-style: none;
		}

		.nav-link {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 8px 14px;
			border-radius: 8px;
			font-size: 13.5px;
			font-weight: 600;
			letter-spacing: 0.3px;
			color: #ffffff !important;
			background: transparent;
			border: 1px solid transparent;
			transition: all 0.2s ease;
			white-space: nowrap;
		}

		.nav-link:hover {
			background: rgba(255, 255, 255, 0.08);
			border-color: rgba(255, 255, 255, 0.2);
			transform: translateY(-1px);
		}

		.nav-link.active {
			background: linear-gradient(135deg, rgba(255, 214, 10, 0.2) 0%, rgba(255, 136, 0, 0.2) 100%);
			border-color: var(--accent-gold);
			color: var(--accent-gold) !important;
			box-shadow: 0 0 12px rgba(255, 214, 10, 0.3);
		}

		.nav-user-panel {
			display: flex;
			align-items: center;
			gap: 10px;
		}

		.btn-primary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: linear-gradient(135deg, #ffd60a 0%, #ff8800 100%);
			color: #05050a !important;
			font-family: var(--font-title);
			font-weight: 800;
			font-size: 13px;
			padding: 8px 16px;
			border-radius: 8px;
			border: none;
			cursor: pointer;
			box-shadow: 0 4px 15px rgba(255, 214, 10, 0.4);
			transition: all 0.25s ease;
			text-transform: uppercase;
		}

		.btn-primary * { color: #05050a !important; }

		.btn-primary:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(255, 214, 10, 0.6);
		}

		.btn-secondary {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			background: rgba(255, 255, 255, 0.06);
			color: #ffffff !important;
			border: 1px solid var(--border-color);
			font-weight: 600;
			font-size: 13px;
			padding: 8px 14px;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.25s ease;
		}

		.btn-secondary:hover {
			background: rgba(255, 255, 255, 0.12);
			border-color: rgba(255, 255, 255, 0.3);
		}

		#game-viewport {
			flex: 1;
			width: 100%;
			height: calc(100vh - 73px);
			border: none;
			background: #111119;
			display: block;
		}

		/* Modal Auth */
		.modal-backdrop {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.85);
			backdrop-filter: blur(8px);
			display: none;
			justify-content: center;
			align-items: center;
			z-index: 9999;
		}

		.modal-box {
			background: var(--bg-card);
			border: 1px solid var(--border-bright);
			border-radius: 16px;
			width: 90%;
			max-width: 440px;
			padding: 28px;
			position: relative;
			box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
		}

		.modal-close-btn {
			position: absolute;
			top: 16px;
			right: 16px;
			background: transparent;
			border: none;
			font-size: 20px;
			cursor: pointer;
			opacity: 0.6;
		}

		.modal-close-btn:hover { opacity: 1; }

		@media (max-width: 1100px) {
			.nav-links {
				overflow-x: auto;
				padding-bottom: 4px;
				scrollbar-width: none;
			}
			.nav-links::-webkit-scrollbar { display: none; }
		}
	</style>
</head>
<body>
	<!-- NAVBAR GLOBAL OMNIVOID -->
	<nav id="navbar">
		<a href="index.html" class="nav-brand">
			<img src="logo_omnivoid.png" alt="OmniVoid Studios" class="nav-logo">
		</a>

		<ul class="nav-links">
			<li><a href="index.html" class="nav-link">Início</a></li>
			<li><a href="jornada.html" class="nav-link">⚡ Jornada Dev</a></li>
			<li><a href="pentest.html" class="nav-link">🛡️ Pentest &amp; Hacking</a></li>
			<li><a href="aula.html" class="nav-link">🎓 Aulas</a></li>
			<li><a href="perfil.html" class="nav-link">👤 Meu Perfil</a></li>
			<li><a href="orcamento.html" class="nav-link">Serviços &amp; Orçamento</a></li>
			<li><a href="plantaoti.html" class="nav-link active">🛠️ Plantão TI</a></li>
			<li><a href="jogos.html" class="nav-link">Jogos</a></li>
			<li><a href="quiz.html" class="nav-link">Teste Dev</a></li>
			<li><a href="projetos.html" class="nav-link">Projetos</a></li>
			<li><a href="devchat.html" class="nav-link">Conversa Dev</a></li>
			<li><a href="sobre.html" class="nav-link">Sobre Mim</a></li>
		</ul>

		<div class="nav-user-panel">
			<div id="auth-logged-out" style="display: flex; align-items: center; gap: 8px;">
				<button class="btn-secondary" onclick="openAuthModal('login')">
					<span>👤 Entrar</span>
				</button>
				<button class="btn-primary" onclick="openAuthModal('register')">
					Cadastrar
				</button>
			</div>

			<div id="auth-logged-in" style="display: none; align-items: center; gap: 8px;">
				<a href="perfil.html" class="btn-secondary" style="border-color: rgba(255, 214, 10, 0.4);">
					<span id="nav-user-avatar">👤</span>
					<span id="nav-user-name">Usuário</span>
				</a>
			</div>
		</div>
	</nav>

	<!-- JOGO COMPLETO PLANTÃO TI (EXECUTADO DIRETAMENTE DA PASTA TI) -->
	<iframe id="game-viewport" src="TI/index.html" allow="autoplay; fullscreen; clipboard-read; clipboard-write;"></iframe>

	<!-- MODAL DE AUTENTICAÇÃO -->
	<div id="modal-auth" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'modal-auth')">
		<div class="modal-box">
			<button class="modal-close-btn" onclick="closeModal('modal-auth')">✕</button>
			
			<div id="auth-tab-row" style="display: flex; gap: 12px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 10px;">
				<button id="tab-btn-login" class="nav-link active" onclick="switchAuthTab('login')">Entrar na Conta</button>
				<button id="tab-btn-register" class="nav-link" onclick="switchAuthTab('register')">Novo Cadastro</button>
			</div>

			<!-- Form Login -->
			<form id="form-auth-login" onsubmit="handleAuthLogin(event)" style="display: flex; flex-direction: column; gap: 14px;">
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">E-mail ou Usuário:</label>
					<input type="text" id="login-user" required placeholder="seu_usuario ou email" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">Senha:</label>
					<input type="password" id="login-pass" required placeholder="••••••••" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 6px;">
					Acessar Conta ➔
				</button>
			</form>

			<!-- Form Register -->
			<form id="form-auth-register" onsubmit="handleAuthRegister(event)" style="display: none; flex-direction: column; gap: 14px;">
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">Seu Nome ou Apelido:</label>
					<input type="text" id="reg-name" required placeholder="Como quer ser chamado" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">E-mail:</label>
					<input type="email" id="reg-email" required placeholder="seu@email.com" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<div>
					<label style="display: block; font-size: 12px; margin-bottom: 6px; opacity: 0.8;">Criar Senha:</label>
					<input type="password" id="reg-pass" required placeholder="Mínimo 6 caracteres" style="width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none;">
				</div>
				<button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 6px;">
					Criar Minha Conta ➔
				</button>
			</form>
		</div>
	</div>

	<!-- Auth logic -->
	<script>
		function updateNavUser() {
			try {
				const user = JSON.parse(localStorage.getItem('omnivoid_user'));
				if (user && (user.name || user.nickname)) {
					document.getElementById('auth-logged-out').style.display = 'none';
					const loggedIn = document.getElementById('auth-logged-in');
					loggedIn.style.display = 'flex';
					document.getElementById('nav-user-name').innerText = user.nickname || user.name;
					document.getElementById('nav-user-avatar').innerText = user.avatar || '👤';
				} else {
					document.getElementById('auth-logged-out').style.display = 'flex';
					document.getElementById('auth-logged-in').style.display = 'none';
				}
			} catch(e) {}
		}

		function openAuthModal(tab) {
			const m = document.getElementById('modal-auth');
			if (m) m.style.display = 'flex';
			switchAuthTab(tab);
		}

		function closeModal(id) {
			const m = document.getElementById(id);
			if (m) m.style.display = 'none';
		}

		function closeModalOnBackdrop(e, id) {
			if (e.target.id === id) closeModal(id);
		}

		function switchAuthTab(tab) {
			const btnLogin = document.getElementById('tab-btn-login');
			const btnReg = document.getElementById('tab-btn-register');
			const formLogin = document.getElementById('form-auth-login');
			const formReg = document.getElementById('form-auth-register');

			if (tab === 'login') {
				btnLogin.classList.add('active');
				btnReg.classList.remove('active');
				formLogin.style.display = 'flex';
				formReg.style.display = 'none';
			} else {
				btnReg.classList.add('active');
				btnLogin.classList.remove('active');
				formReg.style.display = 'flex';
				formLogin.style.display = 'none';
			}
		}

		function handleAuthLogin(e) {
			e.preventDefault();
			const u = document.getElementById('login-user').value.trim();
			const user = { name: u, nickname: u, avatar: '🧑‍💻', level: 1 };
			localStorage.setItem('omnivoid_user', JSON.stringify(user));
			closeModal('modal-auth');
			updateNavUser();
		}

		function handleAuthRegister(e) {
			e.preventDefault();
			const name = document.getElementById('reg-name').value.trim();
			const user = { name: name, nickname: name, avatar: '🧑‍💻', level: 1 };
			localStorage.setItem('omnivoid_user', JSON.stringify(user));
			closeModal('modal-auth');
			updateNavUser();
		}

		document.addEventListener('DOMContentLoaded', updateNavUser);
	</script>
</body>
</html>
